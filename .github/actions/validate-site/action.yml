name: Validate publishing
description: Check one publishing gate and its local browser behavior
inputs:
  gate:
    description: production omits drafts; draft-preview builds and tests them separately
    required: false
    default: production
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7.0.0
      with:
        node-version: 24
        cache: npm
    - run: npm ci --no-audit --no-fund
      shell: bash
    - run: npx playwright install --with-deps chromium
      shell: bash
    - if: ${{ inputs.gate == 'production' }}
      run: npm run check
      shell: bash
    - if: ${{ inputs.gate == 'production' }}
      run: npm run build
      shell: bash
    - if: ${{ inputs.gate == 'production' }}
      run: npm run test:browser
      shell: bash
    - if: ${{ inputs.gate == 'draft-preview' }}
      run: npm run build:preview
      shell: bash
    - if: ${{ inputs.gate == 'draft-preview' }}
      run: npm run test:browser:drafts
      shell: bash
