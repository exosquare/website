name: Deploy website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Read Pages address
        id: pages
        uses: actions/configure-pages@v6.0.0
      - name: Validate production artifact
        uses: ./.github/actions/validate-site
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          ASTRO_TELEMETRY_DISABLED: '1'
      - name: Upload the tested build
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: browser-failure-production
          path: test-results/
          if-no-files-found: ignore
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
      - name: Verify live delivery
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/check-live.mjs
